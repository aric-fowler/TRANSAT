[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transat"
version = "0.1.5"
description = "TRANSAT is a set of SAT tools for solving the transistor-level circuit technologies, built around the Microsoft Z3 SMT solver."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Aric Fowler", email = "aric.fowler@utdallas.edu" }
]
dependencies = [
    "numpy>=1.24",
    "requests"  # example deps
]
requires-python = ">=3.6"

[project.urls]
Homepage = "https://github.com/aric-fowler/TRANSAT"


[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
 